<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZEUSMESS</title>
<meta name="theme-color" content="#000000">
<meta name="description" content="Youssef Ayman (ZEUSMESS): video editor, photographer and AI creative.">
<meta property="og:type" content="website">
<meta property="og:title" content="ZEUSMESS · Youssef Ayman">
<meta property="og:description" content="Video editor, photographer and AI creative. Starbucks campaigns, AI films and photo series.">
<meta property="og:image" content="https://zeusmess.github.io/zeusweb/media/showreel.webp">
<meta property="og:url" content="https://zeusmess.github.io/zeusweb/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="media/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Backdrop: the work itself glows behind the glass -->
<div class="bg" aria-hidden="true">
  <canvas id="ambient" width="64" height="36"></canvas>
  <div class="bg-dots"></div>
  <div class="bg-vignette"></div>
</div>

<!-- Lock screen -->
<div class="lock" id="lock" role="dialog" aria-modal="true" aria-labelledby="lockBrand">
  <div class="lock-tools">
    <button class="chip glass" id="lockSound" type="button"></button>
    <button class="chip glass" id="lockLang" type="button"></button>
  </div>
  <div class="lock-clock">
    <p class="lock-date" id="lockDate"></p>
    <p class="lock-time" id="lockTime">00:00</p>
  </div>
  <div class="lock-eye" aria-hidden="true"></div>
  <p class="lock-brand" id="lockBrand"><b>ZEUSMESS</b><span data-bind="name"></span></p>
  <div class="lock-notes" id="lockNotes"></div>
  <div class="lock-foot">
    <div class="unlock glass" id="unlock">
      <span class="unlock-text" id="unlockText"></span>
      <button class="unlock-knob" id="unlockKnob" type="button"></button>
    </div>
    <span class="home-bar" aria-hidden="true"></span>
  </div>
</div>

<!-- Dynamic Island -->
<header class="island" id="island">
  <button class="isl-face" id="islBtn" type="button" aria-expanded="false" aria-controls="islPanel">
    <span class="isl-eye" aria-hidden="true"></span>
    <span class="isl-no" id="islNo">01</span>
    <span class="isl-label" id="islLabel" aria-live="polite"></span>
    <span class="isl-viz" id="islViz" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
  </button>
  <div class="isl-panel" id="islPanel" hidden></div>
</header>

<main class="deck" id="deck"></main>

<nav class="dock glass" id="dock">
  <span class="dock-lens" id="dockLens" aria-hidden="true"></span>
</nav>

<!-- Media viewer -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-top">
    <div class="sheet-head">
      <span class="sheet-count" id="sheetCount"></span>
      <h2 class="sheet-title" id="sheetTitle"></h2>
    </div>
    <button class="round glass" id="sheetClose" type="button"></button>
  </div>
  <div class="sheet-stage" id="sheetStage"></div>
  <div class="sheet-foot">
    <button class="round glass" id="sheetPrev" type="button"></button>
    <p class="sheet-desc" id="sheetDesc"></p>
    <button class="round glass" id="sheetNext" type="button"></button>
  </div>
</div>

<div class="toast glass" id="toast" role="status" aria-live="polite"></div>
<div class="cursor" id="cursor" aria-hidden="true"><i></i></div>
<div class="scan" aria-hidden="true"></div>

<script src="content.js"></script>
<script src="logo.js"></script>
<script src="gsap.min.js"></script>
<script src="ScrambleTextPlugin.min.js"></script>
<script src="sound.js"></script>
<script src="app.js"></script>
</body>
</html>
